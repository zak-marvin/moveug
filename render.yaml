databases:
  - name: moveug-db
    plan: free

services:
  - type: web
    name: moveug-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: moveug-db
          property: connectionString
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: MOMO_SIMULATE
        value: "True"
      - key: MOMO_TARGET_ENV
        value: "sandbox"
      - key: MOMO_COLLECTION_SUB_KEY
        sync: false
      - key: MOMO_DISBURSEMENT_SUB_KEY
        sync: false
      - key: MOMO_API_USER
        sync: false
      - key: MOMO_API_KEY
        sync: false
